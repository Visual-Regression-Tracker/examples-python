name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [playwright, selenium]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    env:
      VRT_APIURL: http://localhost:4200
      VRT_APIKEY: DEFAULTUSERAPIKEYTOBECHANGED
      VRT_PROJECT: Default project
      VRT_BRANCHNAME: master
      VRT_ENABLESOFTASSERT: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Start Visual Regression Tracker
        working-directory: .github/vrt
        run: docker compose up -d --quiet-pull
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.example }}/requirements.txt
      - run: pip install -r requirements.txt
      - if: matrix.example == 'playwright'
        run: playwright install --with-deps chromium
      - name: Wait for Visual Regression Tracker
        run: timeout 180 bash -c 'until curl -s -o /dev/null http://localhost:4200; do sleep 2; done'
      - run: python example.py
